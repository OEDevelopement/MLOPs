version: '3.8'

services:
  frontend:
    image: mlops25acrprod.azurecr.io/frontend:latest
    ports:
      - "8501:8501"
      - "8001:8001"
    environment:
      - BACKEND_URL=http://.containerapp-env.internal8000
      - API_URL=http://backend.containerapp-env.internal:8000/predict
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://frontend.containerapp-env.internal:8501"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: mlops25acrprod.azurecr.io/backend:latest
    ports:
      - "8000:8000"
    environment:
      - MODEL_SERVICE_URL=http://model_service.containerapp-env.internal:8080/invocations
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend.containerapp-env.internal:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  model-service:
    image: mlops25acrprod.azurecr.io/model_service:latest
    ports:
      - "8080:8080"
      - "9000:9000"
    environment:
      - MODEL_PATH=/app/models/best_model
      - MLFLOW_TRACKING_URI=http://mlflow.containerapp-env.internal:5000
    volumes:
      - models-volume:/app/models
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://model_service.containerapp-env.internal:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: mlops25acrprod.azurecr.io/mlflow:latest
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow.containerapp-env.internal:5000
      - MLFLOW_BACKEND_STORE_URI=/mlflow/mlruns
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
      - MODEL_OUTPUT_PATH=/app/models/best_model
    volumes:
      - mlflow-volume:/mlflow
      - models-volume:/app/models
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://mlflow.containerapp-env.internal:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: mlops25acrprod.azurecr.io/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-volume:/etc/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://prometheus.containerapp-env.internal:9090"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: mlops25acrprod.azurecr.io/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_LOG_LEVEL=debug
    volumes:
      - grafana-volume:/etc/grafana/provisioning
      - grafana-dashboards:/var/lib/grafana/dashboards
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://grafana.containerapp-env.internal:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mlflow-volume:
    name: azurefile-mlflow
    driver: azure-file
    driver_opts:
      share_name: mlflow-data
      storage_account_name: mlopsstorageprod
  
  models-volume:
    name: azurefile-models
    driver: azure-file
    driver_opts:
      share_name: models
      storage_account_name: mlopsstorageprod
  
  prometheus-volume:
    name: azurefile-prometheus
    driver: azure-file
    driver_opts:
      share_name: prometheus
      storage_account_name: mlopsstorageprod
  
  grafana-volume:
    name: azurefile-grafana
    driver: azure-file
    driver_opts:
      share_name: grafana
      storage_account_name: mlopsstorageprod
  
  grafana-dashboards:
    name: azurefile-grafana-dashboards
    driver: azure-file
    driver_opts:
      share_name: grafana-dashboards
      storage_account_name: mlopsstorageprod