
name: Automated Model Retraining

on:
  schedule:
    - cron: '0 0 * * 0'  # Jeden Sonntag um 00:00 Uhr
  workflow_dispatch:

jobs:
  check_environment:
    runs-on: ubuntu-latest
    environment: TEST
    steps:
      - name: Set Environment to TEST
        run: echo "Running retraining process in TEST environment only"

  process_data:
    needs: check_environment
    runs-on: ubuntu-latest
    environment: TEST
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install kaggle

      - name: Set up Kaggle Credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_TOKEN }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download and Process New Data
        run: |
          mkdir -p MLOPs/mlflow/data
          mkdir -p MLOPs/mlflow/data/processed
          mkdir -p MLOPs/mlflow/data/raw
          sudo chmod -R 755 MLOPs/mlflow/data
          kaggle datasets download -d wenruliu/adult-income-dataset -p MLOPs/mlflow/data/raw
          python mlflow/unpack_zip.py
          python mlflow/validate_raw_data.py
          python mlflow/process_data.py
          python mlflow/validate_processed_data.py

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload Data to Azure Storage
        run: |
          az storage blob upload-batch --source MLOPs/mlflow/data/processed --destination ${{ vars.CONTAINER }} --account-name ${{ vars.STORAGE_ACCOUNT }}
          az storage blob upload-batch --source MLOPs/mlflow/data/raw --destination ${{ vars.CONTAINER_RAW }} --account-name ${{ vars.STORAGE_ACCOUNT }}
          echo "New data processed and uploaded to Azure Storage"

  start_vm:
    needs: process_data
    runs-on: ubuntu-latest
    environment: TEST
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set up Azure CLI
        run: |
          az configure --defaults group=${{ vars.RESOURCE_GROUP }}
          az configure --defaults location=${{ vars.LOCATION }}  
      
      - name: Check VM Status and Start if Needed
        run: |
          VM_STATUS=$(az vm get-instance-view --name ${{ vars.VM_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }} --query "instanceView.statuses[1].code" -o tsv)
          if [[ "$VM_STATUS" != "PowerState/running" ]]; then
            echo "VM is not running. Starting VM..."
            az vm start --name ${{ vars.VM_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }}
            echo "Waiting for VM to be fully operational..."
            sleep 120
          else
            echo "VM is already running"
          fi

  retrain_model:
    needs: start_vm
    runs-on: ubuntu-latest
    environment: TEST
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Execute Retraining Process on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "cd ${{ secrets.VM_PROJECT_PATH }} && \
          az login --identity && \
          echo 'Downloading latest data from Azure Storage...' && \
          az storage blob download-batch --source ${{ vars.CONTAINER }} --destination /home/azureuser/MLOPs/mlflow/data/processed --overwrite true && \
          az storage blob download-batch --source ${{ vars.CONTAINER_RAW }} --destination /home/azureuser/MLOPs/mlflow/data/raw --overwrite true && \
          echo 'Restarting MLflow container to train new model...' && \
          docker-compose restart mlflow && \
          echo 'Waiting for training to complete...' && \
          sleep 300 && \
          echo 'Restarting model service to use new model...' && \
          docker-compose restart model_service && \
          echo 'Model retraining and deployment completed'"

