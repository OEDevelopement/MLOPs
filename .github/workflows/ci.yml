name: CI Pipeline

on:
  pull_request:
    branches: 
      - DEV
      - TEST
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'DEV'
        type: choice
        options:
          - DEV
          - TEST
jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit black isort pytest pytest-cov mypy

      - name: Syntax check with flake8
        run: |
          flake8 backend/ frontend/ mlflow/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Style check with flake8
        run: |
          flake8 backend/ frontend/ mlflow/ tests/ --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: |
          black --check backend/ frontend/ mlflow/ tests/

      - name: Type checking with mypy
        run: |
          mypy --ignore-missing-imports backend/ frontend/ mlflow/

      - name: Security check with bandit
        run: |
          bandit -r backend/ frontend/ mlflow/ -x tests/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    #needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install kaggle
          pip install -r mlflow/requirements.txt
  
      - name: Set up Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
      - name: Process newest data
        run: |
            sudo mkdir -p mlflow/data
            sudo mkdir -p mlflow/data/processed
            sudo mkdir -p mlflow/data/raw
            sudo chmod -R 755 mlflow/data
            sudo ls mlflow/        
            sudo kaggle datasets download -d wenruliu/adult-income-dataset -p mlflow/data/raw
            sudo ls mlflow/data/raw
            sudo python mlflow/unpack_zip.py
            sudo ls mlflow/data/raw
            sudo python mlflow/validate_raw_data.py
            sudo python mlflow/process_data.py
            sudo ls mlflow/data/processed
            sudo python mlflow/validate_processed_data.py

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Pull Docker images
        run: |
          docker-compose pull

      - name: Start services with docker-compose
        run: |
          docker-compose up -d

      - name: Wait for services to start
        run: |
          sleep 300

      - name: Run MLFlow tests
        run: |
          pytest mlflow/test_mlflow.py -v

      - name: Run Backend tests
        run: |
          pytest backend/test_backend.py -v

      - name: Run all tests with coverage
        run: |
          pytest --cov=./ --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

      - name: Stop docker-compose services
        if: always()
        run: |
          docker-compose down

  auto-merge:
    name: Auto-Merge to DEV
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.base_ref == 'DEV' && success()
    steps:
      - name: Merge pull request
        uses: pascalgn/automerge-action@v0.15.6
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_LABELS: ""
          MERGE_METHOD: "squash"
          MERGE_COMMIT_MESSAGE: "Auto-merge PR #{pullRequest.number} into DEV branch"
          MERGE_FORKS: "false"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10000"
