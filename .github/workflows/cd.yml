name: CD Pipeline

on:
  push:
    branches: 
      - TEST
      - PROD
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'TEST'
        type: choice
        options:
          - TEST
          - PROD

jobs:
    start_vm:
        runs-on: ubuntu-latest
        steps:
          - name: Azure Login
            uses: azure/login@v1
            with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}

          - name: Set up Azure CLI
            run: |
                az configure --defaults group=${{ vars.RESOURCE_GROUP }}
                az configure --defaults location=${{ vars.LOCATION }}  

          - name: Activate VM
            run: |
                az vm start --name ${{ vars.VM_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }}
                echo "VM activated"

    deploy:
        runs-on: ubuntu-latest
        needs: start_vm
        steps:
          - name: Checkout code
            uses: actions/checkout@v3

          - name: Setup SSH
            run: |
                mkdir -p ~/.ssh
                echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
                chmod 600 ~/.ssh/id_rsa
                ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts
        
          - name: Deploy to Azure VM and Verify
            run: |
                ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "cd ${{ secrets.VM_PROJECT_PATH }} && \
                git pull origin main && \
                az storage blob download-batch --source ${{ vars.CONTAINER }} --account-name ${{ vars.STORAGE_ACCOUNT }} --destination /home/azureuser/MLOPs/data/processed
                az storage blob download-batch --source ${{ vars.CONTAINER }} --account-name ${{ vars.STORAGE_ACCOUNT }} --destination /home/azureuser/MLOPs/mlflow/data/processed
                docker-compose -f docker-compose-prod.yml down && \
                docker-compose -f docker-compose-prod.yml up -d --build && \
                timeout 60 bash -c 'until curl -s http://localhost:8501 > /dev/null; do sleep 5; done' || \
                (echo 'Deployment failed, rolling back' && \
                git reset --hard HEAD~1 && \
                docker-compose -f docker-compose-prod.yml down && \
                docker-compose -f docker-compose-prod.yml up -d --build)"